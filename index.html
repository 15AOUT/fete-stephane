<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fête de Stéphane 🎉</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: #f0f4ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 560px; width: 100%; overflow: hidden; }
    .invitation-img { width: 100%; display: block; }
    .header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 28px 32px 22px; }
    .header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
    .header p { font-size: 0.9rem; opacity: 0.85; }
    .form-body { padding: 32px; display: flex; flex-direction: column; gap: 24px; }
    .field label { display: block; font-weight: 600; font-size: 0.95rem; color: #1e1b4b; margin-bottom: 10px; }
    .required { color: #ef4444; margin-left: 3px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .text-input { width: 100%; border: 2px solid #e0e7ff; border-radius: 10px; padding: 11px 14px; font-size: 0.9rem; font-family: inherit; color: #1e1b4b; outline: none; transition: border-color 0.15s; background: #fafbff; }
    .text-input:focus { border-color: #6366f1; background: white; }
    .options { display: flex; flex-wrap: wrap; gap: 10px; }
    .options input[type="radio"] { display: none; }
    .options label { display: inline-flex; align-items: center; padding: 8px 18px; border: 2px solid #e0e7ff; border-radius: 999px; cursor: pointer; font-size: 0.9rem; font-weight: 500; color: #4338ca; background: #f5f3ff; transition: all 0.15s; user-select: none; }
    .options input[type="radio"]:checked + label { background: #4f46e5; border-color: #4f46e5; color: white; }
    .options label:hover { border-color: #6366f1; background: #eef2ff; }
    .divider { border: none; border-top: 1px solid #e0e7ff; }
    .submit-btn { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; border: none; border-radius: 10px; padding: 14px 32px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: opacity 0.15s; }
    .submit-btn:hover { opacity: 0.92; }
    .merci { display: none; text-align: center; padding: 48px 32px; }
    .merci .emoji { font-size: 3rem; margin-bottom: 16px; }
    .merci h2 { font-size: 1.5rem; color: #1e1b4b; margin-bottom: 10px; }
    .merci p { color: #6b7280; font-size: 0.95rem; }
    @media (max-width: 400px) { .row-2 { grid-template-columns: 1fr; } }
  </style>
</head>

    <h1>🎉 Fête de Stéphane</h1>
    <p>Remplis ce formulaire pour confirmer ta présence. Merci !</p>
  </div>
  <form class="form-body" id="mainForm" action="https://formspree.io/f/xeewjpbo" method="POST" onsubmit="soumettre(event)">
    <div class="row-2">
      <div class="field">
        <label for="prenom">Prénom<span class="required">*</span></label>
        <input class="text-input" type="text" id="prenom" name="prenom" placeholder="Jean" required />
      </div>
      <div class="field">
        <label for="nom">Nom<span class="required">*</span></label>
        <input class="text-input" type="text" id="nom" name="nom" placeholder="Tremblay" required />
      </div>
    </div>
    <div class="field">
      <label for="courriel">Courriel<span class="required">*</span></label>
      <input class="text-input" type="email" id="courriel" name="email" placeholder="jean@exemple.com" required />
    </div>
    <div class="field">
      <label for="telephone">Téléphone <span style="font-weight:400;color:#6b7280;">(pour texto le jour de la surprise)</span><span class="required">*</span></label>
      <input class="text-input" type="tel" id="telephone" name="telephone" placeholder="514 000-0000" required />
    </div>
    <hr class="divider" />
    <div class="field">
      <label>Serez-vous présent(e) ?<span class="required">*</span></label>
      <div class="options">
        <input type="radio" name="presence" id="pres-oui" value="Oui" required />
        <label for="pres-oui">✅ Oui</label>
        <input type="radio" name="presence" id="pres-non" value="Non" />
        <label for="pres-non">❌ Non</label>
      </div>
    </div>
    <hr class="divider" />
    <div class="field">
      <label>Nombre de personnes (incluant vous)<span class="required">*</span></label>
      <div class="options">
        <input type="radio" name="nb_personnes" id="p1" value="1" required /><label for="p1">1</label>
        <input type="radio" name="nb_personnes" id="p2" value="2" /><label for="p2">2</label>
        <input type="radio" name="nb_personnes" id="p3" value="3" /><label for="p3">3</label>
        <input type="radio" name="nb_personnes" id="p4" value="4" /><label for="p4">4</label>
        <input type="radio" name="nb_personnes" id="p5" value="5 et plus" /><label for="p5">5 et plus</label>
      </div>
    </div>
    <hr class="divider" />
    <div class="field">
      <label>Nombre d&apos;enfants de moins de 12 ans<span class="required">*</span></label>
      <div class="options">
        <input type="radio" name="enfants_12" id="e12-0" value="0" required /><label for="e12-0">0</label>
        <input type="radio" name="enfants_12" id="e12-1" value="1" /><label for="e12-1">1</label>
        <input type="radio" name="enfants_12" id="e12-2" value="2" /><label for="e12-2">2</label>
        <input type="radio" name="enfants_12" id="e12-3" value="3 et plus" /><label for="e12-3">3 et plus</label>
      </div>
    </div>
    <hr class="divider" />
    <div class="field">
      <label>Nombre d&apos;enfants de moins de 5 ans<span class="required">*</span></label>
      <div class="options">
        <input type="radio" name="enfants_5" id="e5-0" value="0" required /><label for="e5-0">0</label>
        <input type="radio" name="enfants_5" id="e5-1" value="1" /><label for="e5-1">1</label>
        <input type="radio" name="enfants_5" id="e5-2" value="2" /><label for="e5-2">2</label>
        <input type="radio" name="enfants_5" id="e5-3" value="3 et plus" /><label for="e5-3">3 et plus</label>
      </div>
    </div>
    <hr class="divider" />
    <div class="field">
      <label for="allergie_detail">Allergies alimentaires <span style="font-weight:400;color:#6b7280;">(laisser vide si aucune)</span></label>
      <textarea class="text-input" id="allergie_detail" name="allergie_detail" placeholder="Ex : arachides, gluten, lactose…" style="min-height:80px;resize:vertical;"></textarea>
    </div>
    <button type="submit" class="submit-btn">Envoyer ma réponse</button>
  </form>

</div>
<script>
  async function soumettre(e) {
    e.preventDefault();
    const form = document.getElementById("mainForm");
    const data = new FormData(form);
    try {
      const res = await fetch(form.action, { method: "POST", body: data, headers: { "Accept": "application/json" } });
      if (res.ok) { form.style.display = "none"; document.getElementById("merci").style.display = "block"; }
      else { alert("Une erreur est survenue. Réessaie dans quelques instants."); }
    } catch { alert("Impossible d'envoyer le formulaire. Vérifie ta connexion internet."); }
  }
</script>
</body>
</html>
